# Minimal kitty configuration — seeded by scripts/toggle_theme.sh on first
# theme init, only when ~/.config/kitty/kitty.conf is absent. Extend freely;
# the theme toggle never overwrites a user-authored kitty.conf.

# Tokyo Night theme — current-theme.conf is rewritten by toggle_theme.sh
include current-theme.conf

# Remote control over a user-only socket (default $XDG_RUNTIME_DIR path),
# for live theme switching from toggle_theme.sh
allow_remote_control socket
