# wob OSD bar: transient feedback for volume/brightness changes.
# Started by the guarded wob exec line in config; values are written to
# $XDG_RUNTIME_DIR/sway/wob.sock by scripts/osd-bar.sh (called from the
# volume/brightness control scripts). Absent wob means no OSD, never an
# error.
#
# Colors are v1-neutral: the accent matches the default $indicator_color in
# config. wob has no live reload, so theme-aware colors would need a
# regen-and-restart hook: deliberately deferred (OSD ticket, out of scope).
#
# These color keys belong to wob's implicit default section, before any
# [section] header; wob 0.16 rejects them under an explicit [default].
timeout = 1000
width = 260
height = 34
border_size = 2
bar_padding = 4
anchor = bottom center
margin = 40
bar_color = 5294e2
background_color = 323232D9
border_color = 5294e2
